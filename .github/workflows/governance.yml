name: Repository governance metadata

# GitHub Copilot Free does not include pull-request code review. Keep this
# workflow manual-only so the governance baseline consumes no Actions minutes
# during ordinary pull-request activity. Project CI remains authoritative.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  explain:
    runs-on: ubuntu-latest
    steps:
      - name: Explain governance review source
        run: echo "Use project CI plus evidence-based Codex or human final-material review."

