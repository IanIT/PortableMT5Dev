name: Repository governance

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize, labeled]
  pull_request_review:
    types: [submitted]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  DEPENDENCY_FILE_PATTERN: '(^|/)(package(-lock)?\.json|npm-shrinkwrap\.json|yarn\.lock|pnpm-lock\.yaml|go\.(mod|sum)|packages\.lock\.json|[^/]+\.(csproj|fsproj)|pom\.xml|requirements[^/]*\.txt|poetry\.lock|pyproject\.toml|Pipfile(\.lock)?|Cargo\.(toml|lock)|Gemfile(\.lock)?)$'

jobs:
  request-initial-copilot-review:
    if: github.event_name == 'pull_request' && (github.event.action == 'opened' || github.event.action == 'reopened' || github.event.action == 'ready_for_review') && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Classify review requirement
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
          PULL_AUTHOR: ${{ github.event.pull_request.user.login }}
        shell: bash
        run: |
          set -euo pipefail
          required=true
          author="$PULL_AUTHOR"
          if [[ -z "$author" ]]; then
            echo "Unable to classify PR author; Copilot review remains required"
          fi
          if [[ "$author" == "dependabot[bot]" ]]; then
            files=""
            if ! files=$(gh api --paginate "/repos/$REPOSITORY/pulls/$PULL_NUMBER/files" --jq '.[].filename'); then
              echo "Unable to classify changed files; Copilot review remains required"
            fi
            if [[ -n "$files" ]]; then
              if ! non_dependency=$(DEPENDENCY_FILES="$files" python3 -c 'import os, re; pattern = re.compile(os.environ["DEPENDENCY_FILE_PATTERN"]); print("\n".join(path for path in os.environ["DEPENDENCY_FILES"].splitlines() if not pattern.search(path)))'); then
                echo "Dependency file classification failed"
                exit 1
              fi
              if [[ -z "$non_dependency" ]]; then
                required=false
                echo "Dependency-manifest-only Dependabot change: substantive CI replaces Copilot review"
              fi
            else
              echo "No changed files returned; Copilot review remains required"
            fi
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"
      - name: Request one initial Copilot review
        if: steps.review.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PULL_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api --method POST "/repos/$REPOSITORY/pulls/$PULL_NUMBER/requested_reviewers" \
            -f 'reviewers[]=copilot-pull-request-reviewer[bot]'

  verify-final-material-review:
    if: (github.event_name != 'pull_request' || (github.event.action != 'opened' && github.event.action != 'reopened' && github.event.action != 'ready_for_review')) && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    concurrency:
      group: repository-governance-verification-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    steps:
      - name: Verify Copilot reviewed current head
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "workflow_dispatch is diagnostic only"
            exit 0
          fi
          number=$(jq -r '.pull_request.number // (.review.pull_request_url | split("/")[-1])' "$GITHUB_EVENT_PATH")
          author=$(jq -r '.pull_request.user.login // empty' "$GITHUB_EVENT_PATH")
          if [[ -z "$author" ]]; then
            echo "Unable to classify PR author; exact-head Copilot review remains required"
          fi
          if [[ "$author" == "dependabot[bot]" ]]; then
            files=""
            if ! files=$(gh api --paginate "/repos/$REPOSITORY/pulls/$number/files" --jq '.[].filename'); then
              echo "Unable to classify changed files; exact-head Copilot review remains required"
            fi
            if [[ -n "$files" ]]; then
              if ! non_dependency=$(DEPENDENCY_FILES="$files" python3 -c 'import os, re; pattern = re.compile(os.environ["DEPENDENCY_FILE_PATTERN"]); print("\n".join(path for path in os.environ["DEPENDENCY_FILES"].splitlines() if not pattern.search(path)))'); then
                echo "Dependency file classification failed"
                exit 1
              fi
              if [[ -z "$non_dependency" ]]; then
                echo "Dependency-manifest-only Dependabot change: substantive CI is the review evidence"
                exit 0
              fi
            else
              echo "No changed files returned; exact-head Copilot review remains required"
            fi
          fi
          head=$(jq -r '.pull_request.head.sha // empty' "$GITHUB_EVENT_PATH")
          test -n "$head" || { echo "Unable to identify current PR head"; exit 1; }
          if ! reviewed=$(gh api --paginate "/repos/$REPOSITORY/pulls/$number/reviews?per_page=100" \
            --jq '.[] | select(.user.login == "copilot-pull-request-reviewer[bot]" and .commit_id == "'"$head"'") | .id' | awk 'END { print NR }'); then
            echo "Unable to query Copilot reviews for current head $head"
            exit 1
          fi
          test "$reviewed" -gt 0 || { echo "Copilot has not reviewed current head $head"; exit 1; }
          echo "Copilot review verified for current head $head"

